name: Storage Emulator Rules Tests

on:
  push:
    paths:
      - 'storage.rules'
      - 'firebase.json'
      - 'scripts/storage-emulator.test.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/storage-emulator.yml'
  pull_request:
    paths:
      - 'storage.rules'
      - 'firebase.json'
      - 'scripts/storage-emulator.test.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/storage-emulator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage-emulator:
    name: Storage rules emulator tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GCLOUD_PROJECT: demo-syria-delivery
      FIREBASE_PROJECT_ID: demo-syria-delivery
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned dependencies
        run: npm ci
      - name: Run Storage Emulator tests
        run: npm run test:storage-emulator
