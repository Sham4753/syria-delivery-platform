name: Functions Emulator Integration Tests
on:
  push:
    paths:
      - 'functions/**'
      - 'scripts/seed-emulator.js'
      - 'scripts/functions-emulator.integration.test.js'
      - 'firebase.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/functions-emulator-integration.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  functions-emulator-integration:
    name: Functions/Auth/Firestore emulator integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GCLOUD_PROJECT: demo-syria-delivery
      FIREBASE_PROJECT_ID: demo-syria-delivery
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      FUNCTIONS_EMULATOR: 'true'
      ENFORCE_APPCHECK: 'false'
      ZONES_GEO_CACHE_MS: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install root and Functions dependencies
        run: npm ci && npm ci --prefix functions
      - name: Run callable integration tests three times and report durations
        shell: bash
        run: |
          set -uo pipefail
          total_started_at=$(date +%s)
          for run in 1 2 3; do
            started_at=$(date +%s)
            echo "=== Functions Emulator integration run ${run}/3 ==="
            set +e
            npm run test:functions-emulator-integration
            status=$?
            set -e
            ended_at=$(date +%s)
            duration=$((ended_at - started_at))
            echo "Functions Emulator integration run ${run} status=${status} duration=${duration}s"
            if [ "$status" -ne 0 ]; then
              exit "$status"
            fi
          done
          total_ended_at=$(date +%s)
          echo "Functions Emulator integration total duration: $((total_ended_at - total_started_at))s"
