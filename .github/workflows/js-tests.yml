name: JavaScript Tests and Admin Build

permissions:
  contents: read

on:
  push:
    paths:
      - 'functions/**'
      - 'scripts/**'
      - 'admin-dashboard/**'
      - '.github/workflows/js-tests.yml'
  pull_request:
    paths:
      - 'functions/**'
      - 'scripts/**'
      - 'admin-dashboard/**'
      - '.github/workflows/js-tests.yml'

jobs:
  script-tests:
    name: JavaScript script tests (Node 22)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - name: Install root and Functions dependencies
        run: npm ci && npm ci --prefix functions
      - name: Lint Functions
        working-directory: functions
        run: npm run lint
      - name: Run all discovered script tests
        shell: bash
        run: |
          set +e
          mapfile -t tests < <(find scripts -maxdepth 1 -type f -name '*.test.js' ! -name 'firestore-emulator.test.js' ! -name 'functions-emulator.integration.test.js' -print | sort)
          tests+=(scripts/test-errand-functions.js scripts/test-errand-geo.js)
          failures=()
          for test_file in "${tests[@]}"; do
            echo "===== RUN $test_file ====="
            node "$test_file"
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "===== FAIL $test_file (exit $status) ====="
              failures+=("$test_file")
            else
              echo "===== PASS $test_file ====="
            fi
          done
          if [ "${#failures[@]}" -gt 0 ]; then
            echo "Failed test files: ${failures[*]}"
            exit 1
          fi
          echo "All discovered JavaScript tests passed (${#tests[@]} files)."

  admin-build:
    name: admin-dashboard build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin-dashboard/package-lock.json
      - name: npm ci
        working-directory: admin-dashboard
        run: npm ci
      - name: npm run build
        working-directory: admin-dashboard
        run: npm run build
