name: Build Android Apps

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build type (debug works without signing secrets)'
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
  push:
    branches: [main]
    paths:
      - 'customer_app/**'
      - 'merchant_app/**'
      - 'courier_app/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'customer_app/**'
      - 'merchant_app/**'
      - 'courier_app/**'
      - '.github/workflows/build.yml'

env:
  FLUTTER_VERSION: stable
  FIREBASE_PROJECT_ID: syria-delivery-2026-majed

jobs:
  build:
    name: ${{ matrix.name }} Android APK
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: customer
            dir: customer_app
          - name: merchant
            dir: merchant_app
          - name: courier
            dir: courier_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dependencies
        working-directory: ${{ matrix.dir }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ matrix.dir }}
        run: |
          set +e
          flutter analyze 2>&1 | tee /tmp/flutter-analyze-${{ matrix.name }}.log
          analyzer_status=${PIPESTATUS[0]}
          if grep -qE '(^|[[:space:]])error •' /tmp/flutter-analyze-${{ matrix.name }}.log; then
            echo "Dart analyzer reported real errors."
            exit 1
          fi
          if [ "$analyzer_status" -ne 0 ]; then
            echo "Analyzer returned non-zero only for warnings/infos; continuing."
          fi

      - name: Tests
        working-directory: ${{ matrix.dir }}
        run: |
          if [ -d test ]; then flutter test; else echo "No Flutter tests; skipping."; fi

      - name: Decode release signing files
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_mode == 'release') }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        working-directory: ${{ matrix.dir }}
        run: |
          test -n "$KEYSTORE_B64" || (echo 'Missing Android signing secrets.' && exit 1)
          echo "$KEYSTORE_B64" | base64 --decode > android/app/mimoapp-release.jks
          cat > android/key.properties <<EOF
          storeFile=mimoapp-release.jks
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF

      - name: Build debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_mode == 'debug' }}
        working-directory: ${{ matrix.dir }}
        run: flutter build apk --debug --build-number=${{ github.run_number }}

      - name: Build signed release APK and AAB
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_mode == 'release' }}
        working-directory: ${{ matrix.dir }}
        run: |
          flutter build apk --release --build-number=${{ github.run_number }}
          flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: Collect APK artifact
        working-directory: ${{ matrix.dir }}
        run: |
          mkdir -p build/release-artifacts
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.build_mode }}" = "release" ]; then
            cp build/app/outputs/flutter-apk/app-release.apk build/release-artifacts/syria-delivery-${{ matrix.name }}-release.apk
            cp build/app/outputs/bundle/release/*.aab build/release-artifacts/syria-delivery-${{ matrix.name }}-release.aab
          else
            cp build/app/outputs/flutter-apk/app-debug.apk build/release-artifacts/syria-delivery-${{ matrix.name }}-debug.apk
          fi
          ls -lh build/release-artifacts

      - name: Upload APK/AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-apks-${{ matrix.name }}
          path: ${{ matrix.dir }}/build/release-artifacts/*
          if-no-files-found: error
